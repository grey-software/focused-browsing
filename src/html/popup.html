<!DOCTYPE html>
<html>
  <head>
    <title>buyao</title>
    <link rel="stylesheet" type="text/css" href="../css/popup.css" />
    <meta charset="UTF-8" />
  </head>
  <body>
    <div class="popup-container">
      <div class="title-container">
        <p class="title">buyao</p>
      </div>
      <p class="shortcut-container">
        Press
        <strong class="shortcut-caption-emphasis-1">LeftShift &#43; RightShift</strong>
        to show/hide feeds
      </p>

      <div class="settings-container">
        <div class="setting">
          <label for="show-quote">Show Quote</label>
          <input type="checkbox" id="show-quote" />
        </div>
        <div class="setting">
          <label for="font-size">Font Size</label>
          <input type="range" id="font-size" min="10" max="30" value="16" />
        </div>
      </div>
    </div>
    <script src="../popup.js"></script>
  </body>
</html>
