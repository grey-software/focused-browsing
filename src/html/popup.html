<!DOCTYPE html>
<html>
  <head>
    <title>buyao</title>
    <link rel="stylesheet" type="text/css" href="../css/popup.css" />
    <meta charset="UTF-8" />
  </head>
  <body>
    <div class="popup-container">
      <!-- Header -->
      <div class="header">
        <div class="brand">
          <div class="logo-placeholder"></div>
          <h1 class="title">buyao</h1>
        </div>
        <div class="tagline">Focus on what matters</div>
      </div>

      <!-- Shortcut Info -->
      <div class="shortcut-section">
        <div class="shortcut-label">Toggle focus mode</div>
        <div class="shortcut-keys">
          <kbd class="key">⇧</kbd>
          <span class="plus">+</span>
          <kbd class="key">⇧</kbd>
        </div>
        <div class="shortcut-hint">Left Shift + Right Shift</div>
      </div>

      <!-- Settings -->
      <div class="settings-section">
        <h2 class="section-title">Quote Settings</h2>
        
        <div class="setting-row">
          <div class="setting-info">
            <label class="setting-label" for="show-quote">Show inspirational quotes</label>
            <p class="setting-description">Display motivational quotes when feeds are blocked</p>
          </div>
          <label class="toggle">
            <input type="checkbox" id="show-quote" />
            <span class="toggle-slider"></span>
          </label>
        </div>

        <div class="setting-row" id="font-size-row">
          <div class="setting-info">
            <label class="setting-label" for="font-size">Text size</label>
            <p class="setting-description">Choose the size for quote text and attribution</p>
          </div>
          <div class="size-selector">
            <button type="button" class="size-option" data-size="small">S</button>
            <button type="button" class="size-option" data-size="medium">M</button>
            <button type="button" class="size-option" data-size="large">L</button>
            <button type="button" class="size-option" data-size="xlarge">XL</button>
          </div>
        </div>
      </div>
    </div>
    <script src="../popup.js"></script>
  </body>
</html>
