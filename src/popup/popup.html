<!DOCTYPE html>
<html>
  <head>
    <title>Focused Browsing</title>
    <link rel="stylesheet" type="text/css" href="popup.css" />
    <meta charset="UTF-8" />
  </head>
  <body>
    <main class="popup-shell">
      <div class="index-row">
        <span class="index-label">Focused Browsing</span>
      </div>

      <div class="top-rule"></div>
      <h1 class="title">Reclaim Your Focus</h1>
      <p class="summary">LinkedIn, YouTube, and X start in Focused mode.</p>

      <div class="info-grid">
        <div class="info-row">
          <span class="info-label">Sites</span>
          <span class="info-value">LinkedIn, YouTube, X</span>
        </div>
        <div class="info-row">
          <span class="info-label">Shortcut</span>
          <span class="info-value">Left Shift + Right Shift</span>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="options-button" id="open-options">
          Open Settings
        </button>
      </div>
    </main>
    <script src="../popup.js"></script>
  </body>
</html>
